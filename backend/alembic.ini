# Konfigurasi Alembic (migrasi skema database). URL database diambil dari DATABASE_URL lewat database.py.
# Backend menjalankan migrasi otomatis saat start (database.init_db). Membuat migrasi baru:
#   cd backend && alembic revision --autogenerate -m "deskripsi singkat"
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
file_template = %%(rev)s_%%(slug)s
